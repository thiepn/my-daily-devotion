name: Phase 0 Contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-phase0:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify canonical Phase 0 contracts
        run: npm run verify:phase0
