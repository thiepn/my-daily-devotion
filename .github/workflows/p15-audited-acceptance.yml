name: P15 Audited Acceptance Preparation

on:
  pull_request:
    paths:
      - "scripts/p15/**"
      - "scripts/p10/**"
      - "docs/P15_AUDITED_ACCEPTANCE_REHEARSAL.md"
      - ".github/workflows/p15-audited-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nondeploying-acceptance-tests:
    name: Signature pinning, human decision boundary and dry-run release safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Reject forged attestation, replay, visual omissions and unsafe rollout
        run: node --test scripts/p15/acceptance.check.mjs
