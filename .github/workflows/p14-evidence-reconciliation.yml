name: P14 Independent Evidence Preparation

on:
  pull_request:
    paths:
      - "scripts/p14/**"
      - "scripts/p13/**"
      - "docs/P14_INDEPENDENT_EVIDENCE_RECONCILIATION.md"
      - ".github/workflows/p14-evidence-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewer-evidence-regressions:
    name: Source-linked review, device claim and forward-recovery tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Fail-closed reviewer source, history, privacy and backup checks
        run: node --test scripts/p14/reconcile.check.mjs
