name: Materialize MCheyne Plan

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate-mcheyne.mjs"
      - "scripts/build-bsb.mjs"
      - "canonical/mcheyne/source-manifest.json"
      - ".github/workflows/materialize-mcheyne.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm install --ignore-scripts

      - name: Build pinned BSB corpus
        run: npm run bible:build

      - name: Materialize canonical plan
        run: node scripts/generate-mcheyne.mjs

      - name: Commit canonical artifact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canonical/mcheyne/plan.v1.json
          if git diff --cached --quiet; then
            echo "Canonical plan is already materialized."
            exit 0
          fi
          git commit -m "data: materialize canonical M'Cheyne plan"
          git push origin HEAD:main
