name: Generate Release Lockfile

on:
  push:
    branches:
      - phase12-release-hardening
    paths:
      - package.json
      - .github/workflows/lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase12-release-hardening
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate package-lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package-lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
          else
            git commit -m "build: lock release dependency graph"
            git push origin HEAD:phase12-release-hardening
          fi
