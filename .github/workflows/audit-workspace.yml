name: Corrective release workspace
on:
  push:
    branches: [fix/audit-corrective-release]
    paths: [.github/workflows/audit-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run bible:build && npm run mcheyne:build
      - name: Archive source and locked verification dependencies
        run: |
          git rev-parse HEAD > WORKSPACE_COMMIT
          tar -czf "$RUNNER_TEMP/mdd-workspace.tar.gz" --exclude=.git --exclude=test-results --exclude=playwright-report .
      - uses: actions/upload-artifact@v4
        with:
          name: mdd-corrective-workspace
          path: ${{ runner.temp }}/mdd-workspace.tar.gz
          retention-days: 1
