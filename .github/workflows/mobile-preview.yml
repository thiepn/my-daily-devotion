name: Mobile design preview
on:
  push:
    branches: [design/mobile-app-layout]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-design-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Record exact preview identity
        run: echo "$GITHUB_SHA" > PREVIEW_SOURCE_COMMIT
      - name: Prepare development snapshot
        run: tar --exclude=.git --exclude=release --exclude=test-results --exclude=playwright-report -czf /tmp/mdd-mobile-workspace.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: mdd-mobile-workspace
          path: /tmp/mdd-mobile-workspace.tgz
          retention-days: 1
