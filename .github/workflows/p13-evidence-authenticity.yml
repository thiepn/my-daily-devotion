name: P13 Evidence Authenticity Preparation

on:
  pull_request:
    paths:
      - "scripts/p13/**"
      - "scripts/p10/**"
      - "docs/P13_EVIDENCE_AUTHENTICITY_REVIEWER_PREPARATION.md"
      - ".github/workflows/p13-evidence-authenticity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-authenticity-regressions:
    name: GitHub provenance and unsigned reviewer receipt tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate fixed-route API, anti-replay intake and fail-closed receipts
        run: node --test scripts/p13/evidence.check.mjs
