name: Release Certification CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit, contracts and one production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:prod
      - name: Build and inventory every required test
        run: npm run verify:phase12 -- build
      - id: plan
        run: echo "matrix=$(node scripts/certify.mjs matrix)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mdd-production-build
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: mdd-build-evidence
          path: verification/build/
          if-no-files-found: error
      - name: Retain failed build evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mdd-build-failure
          path: verification/
          if-no-files-found: ignore

  browser:
    name: Browser ${{ matrix.id }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - uses: actions/download-artifact@v4
        with:
          name: mdd-production-build
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: mdd-build-evidence
          path: verification/build/
      - run: npm run verify:phase12 -- shard ${{ matrix.id }}
      - name: Retain shard evidence and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdd-shard-${{ matrix.id }}
          path: verification/shards/${{ matrix.id }}/
          if-no-files-found: error
      - name: Retain browser captures and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-captures-${{ matrix.id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  visual:
    name: Reviewed journal image comparisons
    needs: build
    runs-on: windows-2025
    # The expanded, single-worker image inventory needs setup/upload time in
    # addition to its ~14-minute comparison run. Assertions remain unchanged.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - uses: actions/download-artifact@v4
        with:
          name: mdd-production-build
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: mdd-build-evidence
          path: verification/build/
      - run: npm run verify:phase12 -- shard visual
      - name: Retain image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdd-shard-visual
          path: verification/shards/visual/
          if-no-files-found: error
      - name: Retain comparisons for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-image-comparisons
          path: |
            visual-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  certify:
    name: Certify exact artifact and complete evidence
    needs: [build, browser, visual]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: mdd-production-build
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: mdd-build-evidence
          path: verification/build/
      - uses: actions/download-artifact@v4
        with:
          pattern: mdd-shard-*
          path: verification/shards/
          merge-multiple: false
      - run: npm run verify:phase12 -- finish
      - uses: actions/upload-artifact@v4
        with:
          name: mdd-certified-release
          path: release/
          if-no-files-found: error
          retention-days: 90
