name: Release Certification CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Audit production dependencies
        run: npm run audit:prod
      - name: Verify Phase 12
        run: npm run verify:phase12
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-failure-evidence
          path: |
            playwright-report
            test-results
            verification/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload visual acceptance evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mdd-visual-acceptance-evidence
          path: |
            test-results/**/*.png
            playwright-report/
            verification/
          if-no-files-found: error
          retention-days: 14
      - name: Upload certified release package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mdd-certified-release
          path: release/
          if-no-files-found: error
          retention-days: 90

      - name: Upload certified site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Deploy certified app to GitHub Pages
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mdd-certified-release
          path: release/
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed release identity and executable assets
        run: node scripts/verify-deployment.mjs "${{ steps.deployment.outputs.page_url }}"
      - uses: actions/upload-artifact@v4
        with:
          name: mdd-deployment-verification
          path: release/deployment-verification.json
          retention-days: 90

  release:
    name: Publish verified corrective release
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mdd-certified-release
          path: release/
      - uses: actions/download-artifact@v4
        with:
          name: mdd-deployment-verification
          path: release/
      - name: Publish immutable versioned package and exact-run evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "A release for this version already exists; refusing to overwrite its assets or tag."
            exit 0
          fi
          gh release create "v$VERSION" release/* --target "$GITHUB_SHA" --title "My Daily Devotion $VERSION" --notes-file docs/CORRECTIVE_RELEASE_1.0.1.md
