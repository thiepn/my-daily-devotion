name: P11 Release Handoff Preparation

on:
  pull_request:
    paths:
      - "scripts/p11/**"
      - "scripts/p10/**"
      - "docs/P11_RELEASE_HANDOFF_PREPARATION.md"
      - ".github/workflows/p11-handoff-prep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff-preparation-tests:
    name: Reject unsafe handoffs and unsigned release approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate SHA, origin, immutable assets, reviewer claims and forward recovery
        run: node --test scripts/p11/handoff.check.mjs
