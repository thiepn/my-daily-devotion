name: Mobile-first redesign preview

on:
  push:
    branches:
      - design/mobile-first-1.2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-first-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Verify mobile layout contract
        run: npm run verify:mobile-layout
      - name: Run mobile layout and visual evidence
        run: npx playwright test tests/ux/mobile-first-layout.spec.ts tests/ux/visual-certification.spec.ts --project=desktop-chromium
      - name: Upload mobile redesign screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mdd-mobile-first-preview
          path: |
            test-results/**/*.png
            playwright-report/
          if-no-files-found: error
          retention-days: 7
